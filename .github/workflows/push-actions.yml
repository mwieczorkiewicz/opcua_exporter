name: Push Actions
on: [push, pull_request]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read 
    strategy:
      matrix:
        go:
          - '1.23'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}
      - name: unit-test
        run: go test -short ./...
        
      # Not sure if we stand to learn much by running build after test here, but it shouldn't cost much either.
      - name: build 
        run: go build ./cmd/opcua_exporter

  build-docker:
    runs-on: ubuntu-24.04
    needs: test-and-build
    permissions:
      contents: read      
      packages: write     
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Short commit SHA with sanitized branch prefix
            type=sha,format=short,prefix={{branch}}-
            # Latest tag only for main branch
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false
            prefix=
            suffix=
          # Enable automatic sanitization of branch names
          transform: |
            {{replace branch "/" "-"}}

      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push to GHCR for e2e testing (both pushes and PRs)
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-test:
    runs-on: ubuntu-24.04
    needs: build-docker
    if: always() && (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped')
    permissions:
      contents: read  # Required to checkout code
    strategy:
      matrix:
        go:
          - '1.23'
    env:
      # Use built image from previous job for e2e tests
      OPCUA_EXPORTER_E2E_IMAGE: ${{ needs.build-docker.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}
          
      - name: Run e2e tests
        run: make e2e
