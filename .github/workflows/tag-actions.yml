
name: Tag Actions
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  push_to_registry:
    name: Build and push image to github packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # Required to checkout code
      packages: write     # Required to push Docker images to GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=ghcr.io/mwieczorkiewicz/opcua_exporter
          VERSION=edge
          SEMVER_REGEX="^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            # Replace / with - and ensure the version doesn't start with a dash
            VERSION=$(echo "$BRANCH_NAME" | sed -r 's#/+#-#g' | sed 's/^-/branch-/')
          elif [[ $GITHUB_REF == refs/pull/* ]]; then
            PR_NUMBER=${GITHUB_REF#refs/pull/}
            PR_NUMBER=${PR_NUMBER%/merge}
            VERSION=pr-${PR_NUMBER}
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:sha-${GITHUB_SHA::8}"
          fi
          if [[ $VERSION =~ $SEMVER_REGEX ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          tags: ${{ steps.prep.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
